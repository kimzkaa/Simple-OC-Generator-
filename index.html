    function random(arr) {
      return arr[Math.floor(Math.random() * arr.length)]
    }

    function weightedRandom(arr) {
      let totalWeight = arr.reduce((sum, item) => sum + item.weight, 0)

      let randomNum = Math.random() * totalWeight

      for (let item of arr) {
        if (randomNum < item.weight) {
          return item.name
        }

        randomNum -= item.weight
      }
    }

    function set(id, value) {
      document.getElementById(id).innerText = value
    }

    function generateOC() {
      set('gender', random(data.gender))
      set('age', random(data.age))
      set('race', weightedRandom(data.race))
      set('role', random(data.role))
      set('personality', random(data.personality))

      set('skin', random(data.skin))
      set('eyes', random(data.eyes))
      set('hair', random(data.hair))
      set('hairstyle', random(data.hairstyle))
      set('outfit', random(data.outfit))
      set('accessory', random(data.accessory))

      set('power', weightedRandom(data.power))
      set('weapon', weightedRandom(data.weapon))
      set('origin', random(data.origin))
      set('goal', random(data.goal))
    }

    generateOC()
